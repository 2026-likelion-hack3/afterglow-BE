services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afterglow}
      POSTGRES_USER: ${POSTGRES_USER:-afterglow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afterglow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - afterglow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afterglow} -d ${POSTGRES_DB:-afterglow}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  afterglow-postgres-data:
