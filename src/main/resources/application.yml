spring:
  application:
    name: afterglow-be
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

afterglow:
  jwt:
    secret: ${JWT_SECRET:local-only-development-secret-key-change-this-in-prod-32bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:2592000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
