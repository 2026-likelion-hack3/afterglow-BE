spring:
  application:
    name: afterglow-be
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

afterglow:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:2592000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000}
  openai:
    enabled: ${OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENAI_READ_TIMEOUT:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
