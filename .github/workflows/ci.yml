name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 로컬 개발 환경과 맞춘 고정 메이저 버전(18). 운영 RDS 버전이 정해지면 함께 맞춘다.
        image: postgres:18
        env:
          # CI 전용 계정/DB. 운영 RDS 정보나 실제 비밀값이 아니다.
          POSTGRES_DB: afterglow
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d afterglow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # local 프로파일을 그대로 재사용한다. local 기본 DB_PORT(5433)는 로컬 네이티브 PostgreSQL과의
      # 포트 충돌을 피하기 위한 값이라 CI에는 해당 없음 — CI의 postgres 서비스는 컨테이너 표준 포트인
      # 5432로 호스트에 매핑돼 있으므로 DB_PORT로 되돌린다.
      SPRING_PROFILES_ACTIVE: local
      DB_PORT: "5432"
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (verify only, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: afterglow-be:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
