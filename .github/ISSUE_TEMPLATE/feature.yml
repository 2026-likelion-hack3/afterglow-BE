name: "[FEAT] 기능 요청"
description: 새 기능 또는 기능 개선을 제안/등록한다
title: "[FEAT] "
labels: ["feat"]
body:
  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 무엇을 만들 것인지 간결하게 설명한다.
    validations:
      required: true
  - type: textarea
    id: spec-ref
    attributes:
      label: 관련 기능명세 또는 화면
      description: 기능명세서 장/절 번호, 화면명, 관련 패키지(onboarding/episode/vanity 등)를 적는다.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 왜 필요한지, 어떤 문제를 해결하는지 적는다.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 상세 작업 목록
      description: 체크리스트 형태로 작성한다.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: api-db-change
    attributes:
      label: API 또는 DB 변경 여부
      options:
        - 변경 없음
        - API 변경 포함
        - DB 스키마 변경 포함
        - API + DB 변경 모두 포함
    validations:
      required: true
  - type: textarea
    id: done-criteria
    attributes:
      label: 완료 조건
      description: 이 이슈가 끝났다고 판단할 수 있는 구체적인 기준.
    validations:
      required: true
  - type: textarea
    id: test-items
    attributes:
      label: 테스트 항목
      description: 검증해야 할 케이스(정상/예외/경계값 등).
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 문서, 디자인, 이전 논의 링크 등.
    validations:
      required: false
